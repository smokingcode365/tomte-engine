name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned upstream snapshot
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.2
      - run: uv sync --locked
      - run: uv run --no-sync pytest tests
        env:
          TOMTE_RUN_POSTGRES_TESTS: "0"
          TOMTE_RUN_REDIS_TESTS: "0"

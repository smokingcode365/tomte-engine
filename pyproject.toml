[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tomte-engine"
version = "1.0.0"
description = "A Python conversational memory engine with structured facts and history"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- Core AI & Data Models ---
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",      # FIX: Explicitly declared for config.py
    "python-dotenv>=1.0.0",          # Used directly by bootstrap and demo
    "pydantic-ai>=1.84.0",
    # --- Database & Caching ---
    "psycopg[binary,pool]>=3.2.0",   # FIX: Added 'binary' to prevent libpq compilation errors
    "pgvector>=0.3.0",
    "redis>=7.4.0",
    # --- LLM Providers ---
    "openai>=1.0.0",
    "tiktoken>=0.12.0",             # Local OpenAI embedding-token limits
    "anthropic>=0.96.0",
    "voyageai>=0.3.7",
    # --- Math & Clustering (Dictionary Builder) ---
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
security = [
    # Moved from main deps: These are only needed if the user opts into PII Scrubbing
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "spacy>=3.8.14",                 
]

[tool.hatch.build.targets.wheel]
packages = ["src/tomte"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/docs", "/demo", "/docker", "/scripts", "/tests", "/evals", "/.github",
    "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md",
    "/pyproject.toml", "/uv.lock", "/compose.yaml", "/compose.test.yaml", "/.env.example",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

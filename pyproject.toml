[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tomte-engine"
version = "0.2.0"
description = "Industrial-grade Agentic RAG and Graph Memory Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "psycopg[pool]>=3.2.0",
    "pgvector>=0.3.0",
    "redis>=7.4.0",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "spacy>=3.8.14",
    "anthropic>=0.96.0",
    "voyageai>=0.3.7",
    "pydantic-ai>=1.84.0",
]

[project.optional-dependencies]
security = [
    "presidio-analyzer",
    "presidio-anonymizer"
]

[tool.hatch.build.targets.wheel]
packages = ["src/tomte"]

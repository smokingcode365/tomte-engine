[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tomte-engine"
version = "0.2.0"
description = "Industrial-grade Agentic RAG and Graph Memory Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- Core AI & Data Models ---
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",      # FIX: Explicitly declared for config.py
    "pydantic-ai>=1.84.0",
    # --- Database & Caching ---
    "psycopg[binary,pool]>=3.2.0",   # FIX: Added 'binary' to prevent libpq compilation errors
    "pgvector>=0.3.0",
    "redis>=7.4.0",
    # --- LLM Providers ---
    "openai>=1.0.0",
    "anthropic>=0.96.0",
    "voyageai>=0.3.7",
    # --- Math & Clustering (Dictionary Builder) ---
    "scikit-learn>=1.7.2",
    "schedule>=1.2.2",
]

[project.optional-dependencies]
security = [
    # Moved from main deps: These are only needed if the user opts into PII Scrubbing
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "spacy>=3.8.14",                 
]

[tool.hatch.build.targets.wheel]
packages = ["src/tomte"]

[tool.uv]
package = true
